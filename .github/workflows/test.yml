name: test unit
on: [pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    name: run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Check impact selector
        run: python3 .github/scripts/test_ci_impact.py
      - name: Select checks
        id: impact
        run: python3 .github/scripts/ci-impact.py >> "$GITHUB_OUTPUT"
      - name: Fetch test LFS data
        if: steps.impact.outputs.mode == 'full'
        run: git lfs pull

      - name: Install dependencies
        if: steps.impact.outputs.mode == 'full'
        run: node common/scripts/install-run-rush.js install

      - name: Build project
        if: steps.impact.outputs.mode == 'full'
        run: node common/scripts/install-run-rush.js build

      - name: Run tests
        if: steps.impact.outputs.mode == 'full'
        run: node common/scripts/install-run-rush.js test
      - name: Record documentation-only decision
        if: steps.impact.outputs.mode == 'none'
        run: echo 'No code or test input changed.'
